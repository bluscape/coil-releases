# Publishes the release's coil-<version>.vsix to the VS Code Marketplace (and to Open VSX
# once an OVSX_PAT secret exists) when a release is published here.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   VSCE_PAT  Azure DevOps token: All accessible organizations, scope Marketplace -> Manage.
#   OVSX_PAT  (optional) open-vsx.org access token. The first run creates the namespace
#             (the package's publisher, bluscape) if it doesn't exist yet.
#
# Run it by hand for an existing release: Actions -> Publish extension -> Run workflow, tag v0.2.4,
# and pick where to publish (a version already on one store would fail there).
name: Publish extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.2.4
        required: true
      target:
        description: Where to publish
        type: choice
        options: [both, marketplace, openvsx]
        default: both

permissions:
  contents: read

jobs:
  publish:
    # Pre-releases stay off the Marketplace.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      # Files dropped onto the release page after Publish arrive a minute or two after this
      # run starts, so wait for the .vsix for up to 15 minutes.
      - name: Download the release's .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          vsix="coil-${version}.vsix"
          for i in $(seq 1 60); do
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$vsix" --clobber 2>/dev/null; then
              break
            fi
            if [ "$i" = 60 ]; then
              echo "::error::$TAG has no $vsix after 15 minutes"
              exit 1
            fi
            echo "No $vsix on $TAG yet; checking again in 15 s ($i/60)"
            sleep 15
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VSIX=$vsix" >> "$GITHUB_ENV"
          sha256sum "$vsix"

      - name: Check its version and platform
        run: |
          unzip -p "$VSIX" extension.vsixmanifest > manifest.xml
          grep -q "Version=\"$VERSION\"" manifest.xml || { echo "::error::$VSIX is not version $VERSION"; exit 1; }
          grep -q 'TargetPlatform="win32-x64"' manifest.xml || { echo "::error::$VSIX is not marked win32-x64"; exit 1; }
          publisher=$(grep -o 'Publisher="[^"]*"' manifest.xml | head -n1 | cut -d'"' -f2)
          name=$(grep -o ' Id="[^"]*"' manifest.xml | head -n1 | cut -d'"' -f2)
          echo "PUBLISHER=$publisher" >> "$GITHUB_ENV"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "$publisher.$name $VERSION win32-x64"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Each store is skipped when it already has this version, so a re-run only fills in what's missing.
      - name: Publish to the VS Code Marketplace
        if: ${{ inputs.target != 'openvsx' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          query='{"filters":[{"criteria":[{"filterType":7,"value":"'"$PUBLISHER.$NAME"'"}]}],"flags":1}'
          found=$(curl -sf -X POST https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery \
            -H 'Content-Type: application/json' -H 'Accept: application/json;api-version=7.2-preview.1' -d "$query" \
            | jq -r --arg v "$VERSION" '[.results[0].extensions[0].versions[]? | select(.version == $v and (.targetPlatform // "") == "win32-x64")] | length' || true)
          if [ "${found:-0}" != "0" ]; then
            echo "$PUBLISHER.$NAME $VERSION is already on the Marketplace: skipping"
            exit 0
          fi
          npx --yes @vscode/vsce@3 publish --packagePath "$VSIX"

      - name: Create the Open VSX namespace if it's missing
        if: ${{ env.OVSX_PAT != '' && inputs.target != 'marketplace' }}
        run: |
          if curl -sf "https://open-vsx.org/api/$PUBLISHER" > /dev/null; then
            echo "Namespace $PUBLISHER exists"
          else
            npx --yes ovsx@0 create-namespace "$PUBLISHER"
          fi

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' && inputs.target != 'marketplace' }}
        run: |
          if curl -sf "https://open-vsx.org/api/$PUBLISHER/$NAME/win32-x64/$VERSION" > /dev/null; then
            echo "$PUBLISHER.$NAME $VERSION is already on Open VSX: skipping"
            exit 0
          fi
          # A version still in Open VSX's scan isn't public yet, so the check above misses it;
          # ovsx then reports it as already published, which counts as done.
          set +e
          out=$(npx --yes ovsx@0 publish "$VSIX" 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ $status -ne 0 ] && echo "$out" | grep -q "is already published"; then
            echo "$PUBLISHER.$NAME $VERSION is already on Open VSX (possibly still being scanned): skipping"
            exit 0
          fi
          exit $status
