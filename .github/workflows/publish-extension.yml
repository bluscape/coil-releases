# Publishes the release's coil-<version>.vsix to the VS Code Marketplace (and to Open VSX
# once an OVSX_PAT secret exists) when a release is published here.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   VSCE_PAT  Azure DevOps token: All accessible organizations, scope Marketplace -> Manage.
#   OVSX_PAT  (optional) open-vsx.org access token; the bluscape namespace must exist.
#
# Run it by hand for an existing release: Actions -> Publish extension -> Run workflow, tag v0.2.4.
name: Publish extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.2.4
        required: true

permissions:
  contents: read

jobs:
  publish:
    # Pre-releases stay off the Marketplace.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Download the release's .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          vsix="coil-${version}.vsix"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$vsix"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VSIX=$vsix" >> "$GITHUB_ENV"
          sha256sum "$vsix"

      - name: Check its version and platform
        run: |
          unzip -p "$VSIX" extension.vsixmanifest > manifest.xml
          grep -q "Version=\"$VERSION\"" manifest.xml || { echo "::error::$VSIX is not version $VERSION"; exit 1; }
          grep -q 'TargetPlatform="win32-x64"' manifest.xml || { echo "::error::$VSIX is not marked win32-x64"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3 publish --packagePath "$VSIX"

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx@0 publish "$VSIX"
